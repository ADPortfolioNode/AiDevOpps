services:
  aidevops: # Next.js application
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: always

  chroma:
    image: chromadb/chroma
    volumes:
      - chroma_data:/chroma/data
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    restart: always

volumes:
  chroma_data: